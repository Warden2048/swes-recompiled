; Star Wars Battlefront: Elite Squadron (recompiled) - settings
; Edit and restart the game. Lines starting with ; are comments.

[video]
renderer = gpu        ; gpu = OpenGL renderer, software = CPU renderer
resolution_scale = 3  ; GPU internal resolution: 1 = 480x272 (original), 2 = 960x544, 3 = 1440x816, 4 = 1920x1088 ...
fullscreen = 0        ; 1 = start in borderless fullscreen (F11 toggles)
smooth = 1            ; 1 = smooth scaling, 0 = sharp pixels
fps_unlock = 60       ; frame-rate cap: 0 = original (20-30 FPS), 60 = raise the game's cap to 60 FPS

[mouse]
; Click inside the window to capture the mouse, Esc to release it.
mode = aim            ; aim = true mouse aim on foot; in vehicles and starfighters the mouse steers like the stick
;                       buttons = mouse presses the look buttons, analog = mouse drives the stick, off
aim_speed = 15        ; aim mode: degrees turned per 100 counts of mouse movement (higher = faster)
invert_y = 0          ; aim mode: 1 = moving the mouse forward looks down
vehicle_sensitivity = 1 ; aim mode: how hard the mouse steers vehicles and starfighters (higher = turns harder)
vehicle_invert_y = 0  ; aim mode: 1 = flip vertical mouse steering in tanks, walkers and turrets
aim_fallback = buttons ; aim mode: what the mouse does where it isn't aiming (menus, map, death cam): buttons, analog or off
sensitivity = 8       ; buttons/analog modes: pixels of mouse movement per look step (lower = faster)
look_up = TRIANGLE
look_down = CROSS
look_left = SQUARE
look_right = CIRCLE

[keys]
; KEY = PSP button. Buttons: CROSS CIRCLE SQUARE TRIANGLE L R START SELECT UP DOWN LEFT RIGHT
;                           ANALOG_UP ANALOG_DOWN ANALOG_LEFT ANALOG_RIGHT
; Keys: A-Z 0-9 UP DOWN LEFT RIGHT SPACE ENTER BACKSPACE TAB SHIFT CTRL ALT F1-F12 NUM0-NUM9 MOUSE1 MOUSE2 MOUSE3
W = ANALOG_UP
S = ANALOG_DOWN
A = ANALOG_LEFT
D = ANALOG_RIGHT
UP = UP
DOWN = DOWN
LEFT = LEFT
RIGHT = RIGHT
I = TRIANGLE
K = CROSS
J = SQUARE
L = CIRCLE
SPACE = CROSS
Z = CROSS
X = CIRCLE
C = SQUARE
V = TRIANGLE
Q = L
E = R
SHIFT = L
ENTER = START
BACKSPACE = SELECT
TAB = SELECT
MOUSE1 = R
MOUSE2 = L

[server]
; True dedicated server: the game's own (unused on PSP) dedicated-server mode. The machine hosts with no
; local player and runs COMBINED maps (ground, space and interior in one battle, players move between
; them); the server is listed under Dedicated servers. Clients join from Multiplayer as usual.
; Can also be switched on for one run with -dedicated (see Dedicated Server.bat).
dedicated = 0         ; 1 = run as a dedicated server
console = 0           ; dedicated: open a server console window (type developer-console commands, see output)
max_players = 16      ; player limit when this PC hosts (dedicated or not), 2..16 (the PSP release capped it at 6)
; Developer-console commands run when a dedicated server starts, separated by |
; NetLink.Connect 0 = internet (OpenSpy), 1 = LAN / Ad Hoc.
; AddMap <map> CQST <classic|prequel>       = combined map (all zones; Conquest only)
; AddMap <map> <CQST|CTF|...> <era> <Gr|Sp|In> = single zone. wait <frames> pauses (60 = 1 second).
; Maps: bspn cato crsc dant deth endr hoth kshk mstf ttne vjun yavn
dedicated_exec = NetLink.Connect 1 | wait 240 | AddMap hoth CQST classic | AddMap kshk CQST classic | AddMap yavn CQST classic | SWB.FE.HostGame
exec =               ; commands run at every start (dedicated or not)
exec_delay = 600      ; frames to wait after start-up before running them
